name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel-analysis:
    name: Bazel Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0

      - name: Show Bazel Version
        run: bazelisk version

      - name: Validate Helper Script Syntax
        run: bash -n rules_monorepo/k8s/k8s_apply_helper.sh rules_monorepo_rust/private/cargo_audit_test.sh

      - name: Query Target Graph
        run: bazelisk query //...

      - name: Test Cargo API
        run: bazelisk test //rules_monorepo_rust:cargo_api_tests

      - name: Build Cargo Workspace And Developer Tools
        run: bazelisk build //examples/cargo_workspace/app //tools/rust:cargo //tools/rust:rust_analyzer_setup

      - name: Analyze Rust Deploy Example
        run: bazelisk build --nobuild //examples/rust_service:app_deploy.apply

      - name: Analyze Frontend Example
        run: bazelisk build --nobuild //examples/svelte_vite_app:bundle //examples/svelte_vite_app:checks //examples/svelte_vite_app:frontend_image
